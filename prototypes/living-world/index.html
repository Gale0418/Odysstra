<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODYSSTRA — 歸航星域・活世界原型</title><style>
:root{color-scheme:dark;--bg:#08121e;--panel:#101e2c;--line:#273d50;--text:#e8eff8;--dim:#9eb1c5;--teal:#60e8cf;--gold:#f2cb79;--red:#fb818f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% 0%,#153346 0%,var(--bg) 50%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}main{max-width:1440px;padding:20px 24px 36px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}h1{font-size:clamp(27px,4vw,46px);font-weight:700;letter-spacing:.08em;margin:4px 0 2px}h2,h3,p{margin:0}h2{font-size:18px}h3{font-size:15px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.2em;font-weight:700}.muted,small{color:var(--dim);font-size:12px;line-height:1.6}.sub{color:var(--dim);font-size:14px}.tag{border:1px solid #547580;border-radius:6px;padding:7px 10px;color:var(--teal);font-size:12px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.stat{background:var(--panel);padding:11px 13px}.stat span{font-size:11px;color:var(--dim);display:block}.stat strong{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}.controls,.buttons{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}button,select{font:inherit;font-size:13px;color:var(--text);border:1px solid #3b5367;border-radius:6px;padding:9px 12px;background:#162a3a;cursor:pointer;min-height:40px}button:hover,select:hover{border-color:var(--teal)}button:disabled{opacity:.38;cursor:not-allowed}button.primary{background:#184d48;color:#b9fff3;border-color:#39877b;font-weight:700}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}label{font-size:12px;color:var(--dim)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:12px;align-items:start}.panel{border:1px solid var(--line);background:#0e1a28;border-radius:10px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.map{display:block;width:100%;background:#07101b;aspect-ratio:10/6.2}.map g.node{cursor:pointer}.map g.node:focus{outline:none}.map g.node:focus .focus-ring{stroke:var(--gold)}.map text{font-family:system-ui,sans-serif;pointer-events:none}.map .star-label{font-size:15px;paint-order:stroke;stroke:#06101d;stroke-width:5;stroke-linejoin:round}.map .zone-label{font-size:12px;letter-spacing:.08em;fill:#a8b7c5}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--dim);padding:10px 14px;border-top:1px solid var(--line)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.section{padding:14px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.data{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:13px;margin:13px 0;color:var(--dim)}.data b{color:var(--text);font-weight:600;text-align:right}.notice{background:#142b39;border:1px solid #305062;border-radius:8px;padding:10px 12px;line-height:1.65;color:#c8e0ef;font-size:13px;margin:8px 0}.notice.end{background:#15352f;border-color:#489789;color:#b4f9e7}.events{max-height:360px;overflow:auto;scrollbar-width:thin}.event{padding:10px 14px;border-bottom:1px solid #1d3042;font-size:13px;line-height:1.55}.event time{color:var(--teal);font-size:11px;font-variant-numeric:tabular-nums;margin-right:7px}.event.player{border-left:3px solid var(--gold)}.event.world{border-left:3px solid #38526c}.footer{margin-top:12px;color:var(--dim);font-size:12px;line-height:1.7}.wide{width:100%}.spacer{flex:1}#toast{min-height:20px;color:var(--gold);font-size:12px}.map-controls{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.map-controls select{max-width:210px}.map-controls .muted{flex:1}@media(max-width:950px){.layout{grid-template-columns:minmax(0,1fr) 270px}.stats{grid-template-columns:repeat(3,1fr)}main{padding:14px}}@media(max-width:700px){main{padding:12px}header{align-items:start;flex-direction:column;gap:8px}.layout{grid-template-columns:1fr}.map{aspect-ratio:10/7}.stat{padding:8px 10px}.stat strong{font-size:17px}.controls{gap:6px}button,select{padding:8px 10px}.events{max-height:280px}.map .star-label{font-size:27px}.map .zone-label{font-size:18px}.map-controls .muted{flex:1 0 100%}.tag{white-space:normal}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main>
<header><div><div class="eyebrow">ODYSSTRA / SIM-01 · OBSERVATION LAB</div><h1>歸航星域</h1><p class="sub">諸神已經隕落，而我們將踏上歸途。</p></div><span class="tag">方案 A · 母國獨立存續</span></header>
<div id="stats" class="stats"></div>
<div class="controls"><button id="run" class="primary">暫停時間</button><button id="step">推進一日</button><label for="scenario">情境</label><select id="scenario"><option value="normal">正常戰後</option><option value="cutoff">商路中斷</option><option value="extreme">殘骸連鎖危機</option></select><button id="reset">重置</button><span class="spacer"></span><button id="save">保存快照</button><button id="load">讀取快照</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="layout"><section class="panel"><div class="panel-head"><h2>戰後星圖</h2><label for="mode">情報視圖 <select id="mode"><option value="observer">世界觀察者</option><option value="player">遠征軍軍圖</option></select></label></div><svg id="map" class="map" viewBox="0 0 1000 620" role="img" aria-label="八個星系的航道及活動艦隊"></svg><div class="legend"><span><i class="dot" style="background:#61e8cf"></i>母國</span><span><i class="dot" style="background:#f2cb79"></i>遠征軍</span><span><i class="dot" style="background:#77a9dc"></i>商船</span><span><i class="dot" style="background:#fb818f"></i>勝方／海盜</span><span><i class="dot" style="background:#bca2ff"></i>巨獸</span><span>虛線：受阻航道</span></div><div class="map-controls"><label for="system">選擇星系</label><select id="system"></select><button id="travel" class="primary">下令航行</button><span class="muted">相鄰航道 · 每段 8 燃料／1 日（測試預設）</span></div><div class="section"><div id="mission" class="notice"></div><div class="buttons"><button id="scan">掃描當前星系</button><button id="supply">購買原料</button><button id="fuel">恆星補燃料（+1 日）</button></div></div></section>
<aside class="panel"><div class="section"><div class="eyebrow">SYSTEM INTELLIGENCE</div><h2 id="system-title">—</h2><div id="info" class="data"></div><p id="hint" class="muted"></p></div><div class="panel-head"><h3>事件／無線電</h3><small id="logmode">世界紀錄</small></div><div id="events" class="events" role="log"></div></aside></div>
<p class="footer">獨立因果驗證原型，非正式引擎與美術。運行時即使不下令，市場、商船、海盜、巨獸與接管部隊仍每個遊戲日更新；暫停、頁面隱藏、讀檔及結算不追算現實離線時間。觀察者可看全圖，軍圖模式只顯示舊資料及本軍團已觀測情報。戰鬥、真實音效、人口傷亡、完整百艦與銀河級規模均未實作。</p></main><script src="world.js"></script><script>
'use strict';
const W=OdysstraWorld,$=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let s=W.create(),running=true,selected='a',mode='observer';const fmt=n=>n.toLocaleString('zh-TW'),colors={home:'#61e8cf',local:'#91afc8',victor:'#fb818f'},ownerNames={home:'母國主權領土',local:'地方勢力',victor:'戰勝國控制'};const notes={v:'勝方從此處出發；不是瞬移到玩家身邊。',a:'出發兵站；原本的軍用識別仍可使用。',b:'固定巨型植物產業：生產可交易的生物材料原料。',c:'戰後殘骸與巨獸可能交會；不是必打的敵人。',d:'市場依實際庫存調整價格，商船可以改道。',e:'通向母國的最後一個外緣中繼。',f:'母國邊境仍正常運作；艦籍驗證後接應。',g:'完整存續的母國母星。抵達即 Happy End。'};
function stateInfo(id){if(mode==='observer')return W.snapshot(s,id);return s.intel[id]||{owner:W.NODES[id][3],day:null,stock:null,price:null,hazard:null,closed:[]};}
const XY=id=>[45+W.NODES[id][1]*910,38+W.NODES[id][2]*545];function point(id){return XY(id).join(',');}
function token(at,color,shape,label,dx,dy){const [x,y]=XY(at);return `<g transform="translate(${x+dx} ${y+dy})"><title>${esc(label)}</title>${shape==='ship'?`<path d="M 0 -10 L 9 8 L 0 4 L -9 8 Z" fill="${color}" stroke="#08121e" stroke-width="2"/>`:shape==='beast'?`<ellipse cx="0" cy="0" rx="13" ry="9" fill="${color}" stroke="#101c33" stroke-width="2"/><path d="M -12 0 L -22 -9 L -22 9 Z" fill="${color}"/>`:`<rect x="-6" y="-6" width="12" height="12" rx="2" fill="${color}" stroke="#08121e" stroke-width="2"/>`}</g>`;}
function draw(){const focused=document.activeElement?.closest?.('#map [data-id]')?.dataset.id;let a=`<defs><radialGradient id="neb"><stop stop-color="#203f58" stop-opacity=".6"/><stop offset="1" stop-color="#07101b" stop-opacity="0"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff2c4"/><stop offset="1" stop-color="#c99850"/></radialGradient><pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#1b2c3b" stroke-width=".7"/></pattern></defs><rect width="1000" height="620" fill="#07101b"/><rect width="1000" height="620" fill="url(#grid)"/><ellipse cx="450" cy="260" rx="430" ry="340" fill="url(#neb)"/><path d="M720 0 H1000 V620 H855 L750 345 Z" fill="#165647" opacity=".12"/><path d="M720 0 L750 345 L855 620" stroke="#367c71" stroke-dasharray="7 9" stroke-width="2" fill="none"/><text class="zone-label" x="780" y="585" fill="#61e8cf">母國主權星區</text><text class="zone-label" x="28" y="35">戰後外國星域</text>`;for(let i=0;i<125;i++){const x=(i*197+33)%1000,y=(i*i*39+67)%620,r=i%9===0?1.7:.65;a+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#d7e7f7" opacity="${.20+(i%5)*.11}"/>`;}
for(const [x,y] of W.EDGES){let blocked=mode==='observer'?!W.open(s,x,y):stateInfo(x).closed.includes(y)||stateInfo(y).closed.includes(x);a+=`<polyline points="${point(x)} ${point(y)}" fill="none" stroke="${blocked?'#dc7e83':'#48617a'}" stroke-width="${blocked?3:2}" ${blocked?'stroke-dasharray="5 8"':''} opacity=".9"/>`;}
for(const id of Object.keys(W.NODES)){let [x,y]=XY(id),n=stateInfo(id),c=colors[n.owner],sel=selected===id;a+=`<g class="node" data-id="${id}" tabindex="0" role="button" aria-label="${esc(W.name(id))}"><circle class="focus-ring" cx="${x}" cy="${y}" r="29" fill="#07101b" stroke="${sel?'#f2cb79':c}" stroke-width="${sel?2.8:1.4}" opacity=".95"/><circle cx="${x}" cy="${y}" r="${id==='g'?16:10}" fill="${c}" opacity=".8"/><circle cx="${x}" cy="${y}" r="${id==='g'?6:4}" fill="#fff" opacity=".85"/><text x="${x}" y="${y+48}" text-anchor="middle" fill="${c}" class="star-label">${esc(W.name(id))}</text>${n.stock!==null?`<rect x="${x-21}" y="${y-39}" width="42" height="4" rx="2" fill="#233b4a"/><rect x="${x-21}" y="${y-39}" width="${42*n.stock/140}" height="4" rx="2" fill="${c}"/>`:''}</g>`;}
if(mode==='observer'){a+=token(s.merchant.at,'#77a9dc','square','商船',-25,-24)+token(s.victor.at,'#fb818f','ship','接管部隊',25,-24)+token(s.pirate.at,'#ef9f79','ship','海盜',30,22)+token(s.beast.at,'#bca2ff','beast','酥殼日眠魚',-32,22);}else if(s.beast.at===s.player.at&&s.intel[s.player.at]?.hazard){a+=token(s.beast.at,'#bca2ff','beast','已觀測巨獸',-32,22);}if(s.escort.active&&(mode==='observer'||s.escort.at===s.player.at))a+=token(s.escort.at,'#61e8cf','ship','國防艦隊',24,-22);if(s.player.to)a+=`<polyline points="${point(s.player.at)} ${point(s.player.to)}" stroke="#f2cb79" stroke-width="4" stroke-dasharray="12 5" fill="none"/>`;a+=token(s.player.at,'#f2cb79','ship','遠征軍',0,-29);$('map').innerHTML=a;if(focused)$('map').querySelector(`[data-id="${focused}"]`)?.focus();}
function notify(t){$('toast').textContent=t;}
function render(){const p=s.player,n=stateInfo(selected);if(s.ended)running=false;$('stats').innerHTML=[['遊戲日',s.day],['艦艇',fmt(p.ships)],['同鄉',fmt(p.people)],['原料',p.raw],['燃料',p.fuel],['測試信用點',p.credits]].map(([k,v])=>`<div class="stat"><span>${k}</span><strong>${v}</strong></div>`).join('');$('run').textContent=running?'暫停時間':'繼續時間';$('run').disabled=s.ended;$('step').disabled=s.ended;$('system').value=selected;$('system-title').textContent=W.name(selected);const rows=[['情報',mode==='observer'?'世界現況':n.day===null?'戰前記錄':`第 ${n.day} 日觀測`],['控制權',ownerNames[n.owner]],['原料庫存',n.stock===null?'未知':n.stock],['單位價格',n.price===null?'未知':n.price],['巨獸訊號',n.hazard===null?'未知':n.hazard?'已偵測':'無'],['受阻航道',n.closed.length?n.closed.map(W.name).join('、'):'未記錄']];$('info').innerHTML=rows.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');$('hint').textContent=notes[selected];$('travel').disabled=s.ended||p.to!==null||selected==='v'||selected===p.at||!W.EDGES.some(([a,b])=>W.key(a,b)===W.key(p.at,selected))||p.raw===0||p.fuel<8;$('scan').disabled=s.ended||!!p.to;$('supply').disabled=s.ended||!!p.to||p.raw>=60||p.credits<=0||s.nodes[p.at].owner==='victor'||s.nodes[p.at].demand===0;$('fuel').disabled=s.ended||!!p.to||p.fuel>=64;$('mission').className='notice'+(s.ended?' end':'');$('mission').textContent=s.ended?'歸航完成 · 歡迎回家。共同母星已抵達，時間停止。':s.escort.joined&&p.at==='f'?'國防艦隊已接應。下一站，共同母星。':p.to?`航行中：${W.name(p.at)} → ${W.name(p.to)}，下一遊戲日結算。`:`目前位於 ${W.name(p.at)}。選擇相鄰星系，補給或觀察；目的地為共同母星。`;$('logmode').textContent=mode==='observer'?'世界紀錄':'本艦通訊';const ev=s.events.filter(e=>mode==='observer'||e.kind==='player');$('events').innerHTML=ev.slice(0,35).map(e=>`<div class="event ${e.kind}"><time>DAY ${String(e.day).padStart(2,'0')}</time>${esc(e.msg)}</div>`).join('');draw();}
function action(fn,ok,fail){const r=fn();notify(r?ok:fail);render();}function tick(){W.tick(s);render();}for(const id of Object.keys(W.NODES))$('system').add(new Option(W.name(id),id));$('system').onchange=e=>{selected=e.target.value;render();};$('map').addEventListener('click',e=>{const node=e.target.closest('[data-id]');if(node){selected=node.dataset.id;render();}});$('map').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-id]');if(n){e.preventDefault();selected=n.dataset.id;render();$('map').querySelector(`[data-id="${selected}"]`)?.focus();}}});$('mode').onchange=e=>{mode=e.target.value;render();};$('run').onclick=()=>{running=!running;render();};$('step').onclick=()=>{running=false;tick();};$('reset').onclick=()=>{s=W.create($('scenario').value);selected='a';running=false;notify('新情境已載入。');render();};$('scenario').onchange=()=>$('reset').click();$('travel').onclick=()=>action(()=>W.travel(s,selected),'航行命令已下達；推進時間抵達。','航道受阻或補給／燃料不足。');$('scan').onclick=()=>action(()=>W.scan(s),'情報已更新。','目前不能掃描。');$('supply').onclick=()=>action(()=>W.resupply(s),'補給交易完成。','庫存、信用點不足或港口不可用。');$('fuel').onclick=()=>action(()=>W.refuel(s),'已消耗一日補燃料。','目前不能採集。');$('save').onclick=()=>{try{localStorage.setItem('odysstra-sim01',JSON.stringify(s));notify('此瀏覽器的快照已保存。');}catch{notify('此環境不允許本地保存。');}};$('load').onclick=()=>{try{const x=JSON.parse(localStorage.getItem('odysstra-sim01'));if(!W.valid(x))throw Error();s=x;running=false;selected=s.player.at;$('scenario').value=s.scenario;notify('已讀取快照；不追算離線時間。');render();}catch{notify('沒有可讀快照，或資料格式不符。');}};render();setInterval(()=>{if(running&&!s.ended&&!document.hidden)tick();},1500);
</script></body></html>
