name: Documentation review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-review.yml'
      - 'tools/check_docs.py'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact public repository revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Inspect and bundle documentation
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          files = sorted(p for p in root.rglob('*.md') if '.git' not in p.parts)
          out = pathlib.Path('/tmp/odysstra-docs-review')
          out.mkdir(parents=True, exist_ok=True)
          manifest = [{'path': p.as_posix(), 'bytes': p.stat().st_size,
                       'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          (out / 'inventory.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with zipfile.ZipFile(out / 'documentation.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.as_posix())
          print(f'Documentation inventory: {len(files)} Markdown files; content review and game tests are separate.')
          PY
          if test -f tools/check_docs.py; then
            python3 tools/check_docs.py --root . --report /tmp/odysstra-docs-review/check-report.json
          fi
      - name: Upload documentation-only review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-review-${{ github.sha }}
          path: /tmp/odysstra-docs-review/
          retention-days: 1
          if-no-files-found: error
